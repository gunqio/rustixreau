name: Rustix Auto Restart

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write      # ← 必须，否则无法删除运行记录
      contents: read

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/AutoRestart.py AutoRestart.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🐍 安装 Python 依赖
        run: pip install curl_cffi requests

      - name: 🛡️ 启动代理（基于 VMESS_LINK）
        env:
          VMESS_LINK: ${{ secrets.VMESS_LINK }}
        run: |
          if [ -z "${VMESS_LINK}" ]; then
            echo "⚠️ 未设置代理，将直连。"
            exit 0
          fi

          if [[ "${VMESS_LINK}" == vmess://* ]]; then
            CLEAN_B64=$(echo "${VMESS_LINK}" | sed 's/vmess:\/\///' | tr -d '\r\n ')
            JSON_STR=$(echo "${CLEAN_B64}" | base64 -d 2>/dev/null || echo "${CLEAN_B64}=" | base64 -d 2>/dev/null || echo "${CLEAN_B64}==" | base64 -d 2>/dev/null)
          else
            JSON_STR="${VMESS_LINK}"
          fi

          if ! echo "${JSON_STR}" | jq . >/dev/null 2>&1; then
            echo "❌ 代理配置解析失败，请检查 VMESS_LINK 格式。"
            exit 1
          fi

          V_ADD=$(echo "${JSON_STR}" | jq -r '.add')
          V_PORT=$(echo "${JSON_STR}" | jq -r '.port')
          V_ID=$(echo "${JSON_STR}" | jq -r '.id')
          V_HOST=$(echo "${JSON_STR}" | jq -r '.host // .sni')
          V_PATH=$(echo "${JSON_STR}" | jq -r '.path')

          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          cat << EOF > config.json
          {
            "inbounds": [{
              "port": 10809,
              "protocol": "http",
              "listen": "127.0.0.1"
            }],
            "outbounds": [{
              "protocol": "vmess",
              "settings": {
                "vnext": [{
                  "address": "${V_ADD}",
                  "port": ${V_PORT:-443},
                  "users": [{
                    "id": "${V_ID}",
                    "alterId": 0,
                    "security": "none"
                  }]
                }]
              },
              "streamSettings": {
                "network": "ws",
                "security": "tls",
                "tlsSettings": {
                  "serverName": "${V_HOST}",
                  "allowInsecure": false
                },
                "wsSettings": {
                  "path": "${V_PATH}",
                  "headers": {
                    "Host": "${V_HOST}"
                  }
                }
              }
            }]
          }
          EOF

          nohup ./xray -config config.json > xray.log 2>&1 &
          sleep 4
          echo "✅ 代理已启动（127.0.0.1:10809）"
          curl -s -x http://127.0.0.1:10809 https://api.ipify.org || echo "⚠️ 代理连通测试失败"

      - name: 🚀 运行 AutoRestart.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python AutoRestart.py

      - name: 🧹 清理旧运行记录（保留最新3个）
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keep = 3;
            
            const allRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            
            const runs = allRuns
              .filter(r => r.name === context.workflow && r.id !== context.runId)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            const toDelete = runs.slice(keep);
            
            console.log(`🔢 当前工作流共 ${runs.length + 1} 条记录（含本次）`);
            console.log(`🗑️  将删除 ${toDelete.length} 条旧记录，保留最新 ${keep} 条`);
            
            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                console.log(`✅ 已删除 #${run.run_number}`);
              } catch (e) {
                console.log(`⚠️  #${run.run_number} 删除失败: ${e.message}`);
              }
            }
