name: Rustix Auto Restart

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/AutoRestart.py AutoRestart.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq wget unzip curl

      - name: 🐍 安装 Python 依赖
        run: |
          pip install playwright requests
          playwright install chromium

      # ========== 启动 Xray 代理（可选） ==========
      - name: 🛡️ 启动代理（基于 VMESS_LINK）
        env:
          VMESS_LINK: ${{ secrets.VMESS_LINK }}
        run: |
          if [ -z "${VMESS_LINK}" ]; then
            echo "⚠️ 未设置代理，将直连。"
            exit 0
          fi

          if [[ "${VMESS_LINK}" == vmess://* ]]; then
            CLEAN_B64=$(echo "${VMESS_LINK}" | sed 's/vmess:\/\///' | tr -d '\r\n ')
            JSON_STR=$(echo "${CLEAN_B64}" | base64 -d 2>/dev/null || echo "${CLEAN_B64}=" | base64 -d 2>/dev/null || echo "${CLEAN_B64}==" | base64 -d 2>/dev/null)
          else
            JSON_STR="${VMESS_LINK}"
          fi

          if ! echo "${JSON_STR}" | jq . >/dev/null 2>&1; then
            echo "❌ 代理配置解析失败，请检查 VMESS_LINK 格式。"
            exit 1
          fi

          V_ADD=$(echo "${JSON_STR}" | jq -r '.add')
          V_PORT=$(echo "${JSON_STR}" | jq -r '.port')
          V_ID=$(echo "${JSON_STR}" | jq -r '.id')
          V_HOST=$(echo "${JSON_STR}" | jq -r '.host // .sni')
          V_PATH=$(echo "${JSON_STR}" | jq -r '.path')

          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q xray.zip && chmod +x xray

          cat << EOF > config.json
          {
            "inbounds": [{
              "port": 10809,
              "protocol": "http",
              "listen": "127.0.0.1"
            }],
            "outbounds": [{
              "protocol": "vmess",
              "settings": {
                "vnext": [{
                  "address": "${V_ADD}",
                  "port": ${V_PORT:-443},
                  "users": [{
                    "id": "${V_ID}",
                    "alterId": 0,
                    "security": "none"
                  }]
                }]
              },
              "streamSettings": {
                "network": "ws",
                "security": "tls",
                "tlsSettings": {
                  "serverName": "${V_HOST}",
                  "allowInsecure": false
                },
                "wsSettings": {
                  "path": "${V_PATH}",
                  "headers": {
                    "Host": "${V_HOST}"
                  }
                }
              }
            }]
          }
          EOF

          nohup ./xray -config config.json > xray.log 2>&1 &
          sleep 4
          echo "✅ 代理已启动（127.0.0.1:10809）"
          curl -s -x http://127.0.0.1:10809 https://api.ipify.org || echo "⚠️ 代理连通测试失败"

      - name: 🌐 设置代理环境变量
        run: |
          echo "HTTP_PROXY=http://127.0.0.1:10809" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://127.0.0.1:10809" >> $GITHUB_ENV
          echo "NO_PROXY=localhost,127.0.0.1,api.telegram.org" >> $GITHUB_ENV

      - name: 🚀 运行 AutoRestart.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
        run: python AutoRestart.py

      - name: 📸 上传调试截图和HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: |
            *.png
            *.html
          retention-days: 3
